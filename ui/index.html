<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecMi</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header data-tauri-drag-region><span class="wordmark" data-tauri-drag-region><i></i>RecMi</span><span class="drag-grip" data-tauri-drag-region title="Drag to move"></span><div class="window-controls"><button id="minimize" class="icon-button" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><button id="close" class="icon-button" aria-label="Close RecMi" title="Close RecMi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div></header>
<div class="workspace">
<div class="record-controls"><button id="record" aria-label="Start recording" title="Start recording (F9)"><span class="record-symbol" aria-hidden="true"></span></button><span id="record-label">Start recording</span><span class="shortcut">F9 to start or stop</span></div>
<section class="options" aria-label="Recording options"><div class="modes" aria-label="Capture area"><button id="full" class="selected" aria-pressed="true">Full screen</button><button id="region" aria-pressed="false">Select area</button></div><div class="area-row"><p id="area">Primary monitor</p><button id="edit" class="link" hidden>Edit area ↗</button></div><div class="audio-row"><label for="audio">Sound</label><select id="audio" aria-describedby="audio-hint"><option value="system">System sound</option><option value="microphone">Microphone</option><option value="both">System + microphone</option><option value="silent">No sound</option></select></div><p id="audio-hint">Default speakers or headphones.</p></section></div>
<footer><button id="folder" title="Open recordings folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></svg><span id="folder-label">Videos / RecMi</span><span aria-hidden="true">↗</span></button></footer><p id="message" role="status" hidden></p></main><script src="app.js"></script></body></html>
