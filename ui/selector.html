<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select recording area</title><link rel="stylesheet" href="selector.css"></head><body>
<img id="desktop" alt="Desktop screenshot" draggable="false"><div id="canvas" tabindex="0" aria-label="Draw, move or resize the recording rectangle"><div id="rectangle" hidden><span data-handle="nw"></span><span data-handle="n"></span><span data-handle="ne"></span><span data-handle="e"></span><span data-handle="se"></span><span data-handle="s"></span><span data-handle="sw"></span><span data-handle="w"></span><output id="dimensions"></output></div></div>
<div id="toolbar"><strong id="toolbar-grip" title="Drag to move this toolbar">Select recording area <small>⠿</small></strong><p>Drag to draw · Drag inside to move · Drag handles to resize · Arrow keys to nudge</p><div class="fields"><label>X<input id="x" type="number" min="0"></label><label>Y<input id="y" type="number" min="0"></label><label>Width<input id="width" type="number" min="20" step="2"></label><label>Height<input id="height" type="number" min="20" step="2"></label></div><div class="actions"><button id="reset">Draw new area</button><button id="cancel">Cancel (Esc)</button><button id="confirm" disabled>Use area (Enter)</button></div><p id="error" role="status">Loading desktop…</p></div>
<script src="geometry.js"></script><script src="selector.js"></script></body></html>
